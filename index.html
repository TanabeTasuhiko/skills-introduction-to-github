<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 赤入れチェック</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    background: #f0f0f0;
    color: #333;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #fff;
    border-bottom: 1px solid #ddd;
    flex-wrap: wrap;
    z-index: 10;
  }
  .toolbar button, .toolbar label, .toolbar select {
    font-size: 14px;
    padding: 6px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fafafa;
    cursor: pointer;
    white-space: nowrap;
  }
  .toolbar button:hover, .toolbar label:hover {
    background: #eee;
  }
  .toolbar button.active {
    background: #d32f2f;
    color: #fff;
    border-color: #b71c1c;
  }
  .toolbar .sep {
    width: 1px;
    height: 28px;
    background: #ddd;
  }
  .toolbar .page-info {
    font-size: 14px;
    min-width: 90px;
    text-align: center;
  }
  .toolbar input[type="file"] { display: none; }
  .toolbar input[type="range"] { width: 80px; vertical-align: middle; }
  .pen-size-label { font-size: 13px; }
  .toolbar .color-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid #aaa;
    padding: 0;
    cursor: pointer;
  }
  .toolbar .color-btn.selected {
    border: 3px solid #333;
    box-shadow: 0 0 4px rgba(0,0,0,0.3);
  }

  /* ── Canvas area ── */
  .canvas-area {
    flex: 1;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    background: #e0e0e0;
  }
  .canvas-wrapper {
    position: relative;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    background: #fff;
  }
  .canvas-wrapper canvas {
    display: block;
  }
  #bgCanvas {
    position: relative;
    z-index: 1;
  }
  #drawCanvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    cursor: crosshair;
  }

  /* ── Welcome screen ── */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 20px;
    color: #888;
  }
  .welcome .icon { font-size: 64px; }
  .welcome p { font-size: 16px; text-align: center; line-height: 1.8; }
  .welcome .sub { font-size: 13px; color: #aaa; }

  /* ── Drop overlay ── */
  .drop-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(211, 47, 47, 0.15);
    border: 4px dashed #d32f2f;
    z-index: 100;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    color: #d32f2f;
    font-weight: bold;
  }
  .drop-overlay.show {
    display: flex;
  }

  /* ── Google Drive URL dialog ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    justify-content: center;
    align-items: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    width: 480px;
    max-width: 90vw;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .modal h3 { margin-bottom: 12px; font-size: 16px; }
  .modal input[type="text"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 8px;
  }
  .modal .hint { font-size: 12px; color: #999; margin-bottom: 16px; line-height: 1.6; }
  .modal .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .modal button {
    padding: 8px 20px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fafafa;
    cursor: pointer;
    font-size: 14px;
  }
  .modal button.primary {
    background: #d32f2f;
    color: #fff;
    border-color: #b71c1c;
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #333;
    color: #fff;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 300;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <label for="fileInput">ファイルを開く</label>
  <input type="file" id="fileInput" accept=".pdf,image/*">
  <button id="btnDriveUrl">Google Drive URL</button>
  <div class="sep"></div>
  <button id="btnPen" class="active">ペン</button>
  <button id="btnEraser">消しゴム</button>
  <div class="sep"></div>
  <button class="color-btn selected" style="background:#d32f2f" data-color="#d32f2f"></button>
  <button class="color-btn" style="background:#1565c0" data-color="#1565c0"></button>
  <button class="color-btn" style="background:#2e7d32" data-color="#2e7d32"></button>
  <button class="color-btn" style="background:#333" data-color="#333333"></button>
  <div class="sep"></div>
  <span class="pen-size-label">太さ</span>
  <input type="range" id="penSize" min="1" max="12" value="3">
  <div class="sep"></div>
  <button id="btnUndo">元に戻す</button>
  <button id="btnClear">全消去</button>
  <div class="sep"></div>
  <button id="btnPrev">◀</button>
  <span class="page-info" id="pageInfo">- / -</span>
  <button id="btnNext">▶</button>
  <div class="sep"></div>
  <button id="btnSave">画像保存</button>
</div>

<!-- Canvas Area -->
<div class="canvas-area" id="canvasArea">
  <div class="welcome" id="welcome">
    <div class="icon">&#128221;</div>
    <p>PDF または 画像ファイルをドロップ<br>または「ファイルを開く」で選択してください</p>
    <p class="sub">Ctrl+V で画像を貼り付け / Google Driveの画像もコピー&ペーストで読み込めます</p>
  </div>
  <div class="canvas-wrapper" id="canvasWrapper" style="display:none">
    <canvas id="bgCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
  </div>
</div>

<!-- Drop overlay -->
<div class="drop-overlay" id="dropOverlay">ここにドロップ</div>

<!-- Google Drive URL modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Google Drive 画像URLを入力</h3>
    <input type="text" id="driveUrlInput" placeholder="https://drive.google.com/file/d/xxxxx/view?usp=sharing">
    <div class="hint">
      Google Driveで「リンクを知っている全員に公開」に設定した画像の共有URLを貼り付けてください。<br>
      対応形式: PNG, JPG, GIF, WebP
    </div>
    <div class="modal-actions">
      <button id="btnModalCancel">キャンセル</button>
      <button id="btnModalLoad" class="primary">読み込む</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  // PDF.js worker
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // ── State ──
  const state = {
    mode: 'pen',           // 'pen' | 'eraser'
    color: '#d32f2f',
    lineWidth: 3,
    drawing: false,
    paths: [],             // Array of stroke arrays per page
    allPaths: {},          // page -> paths
    pdfDoc: null,
    currentPage: 1,
    totalPages: 0,
    imageMode: false,      // true when viewing a single image
    scale: 2,
  };

  // ── Elements ──
  const bgCanvas = document.getElementById('bgCanvas');
  const drawCanvas = document.getElementById('drawCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  const drawCtx = drawCanvas.getContext('2d');
  const wrapper = document.getElementById('canvasWrapper');
  const welcome = document.getElementById('welcome');
  const fileInput = document.getElementById('fileInput');
  const pageInfo = document.getElementById('pageInfo');

  // ── Pen / Eraser toggle ──
  document.getElementById('btnPen').addEventListener('click', () => {
    state.mode = 'pen';
    document.getElementById('btnPen').classList.add('active');
    document.getElementById('btnEraser').classList.remove('active');
    drawCanvas.style.cursor = 'crosshair';
  });
  document.getElementById('btnEraser').addEventListener('click', () => {
    state.mode = 'eraser';
    document.getElementById('btnEraser').classList.add('active');
    document.getElementById('btnPen').classList.remove('active');
    drawCanvas.style.cursor = 'grab';
  });

  // ── Color picker ──
  document.querySelectorAll('.color-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      state.color = btn.dataset.color;
      // Switch to pen when selecting color
      document.getElementById('btnPen').click();
    });
  });

  // ── Pen size ──
  document.getElementById('penSize').addEventListener('input', (e) => {
    state.lineWidth = parseInt(e.target.value);
  });

  // ── Drawing ──
  let currentStroke = null;

  function getPos(e) {
    const rect = drawCanvas.getBoundingClientRect();
    const scaleX = drawCanvas.width / rect.width;
    const scaleY = drawCanvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY,
    };
  }

  function startDraw(e) {
    e.preventDefault();
    state.drawing = true;
    const pos = getPos(e);
    currentStroke = {
      mode: state.mode,
      color: state.color,
      width: state.lineWidth * state.scale,
      points: [pos],
    };
  }

  function moveDraw(e) {
    if (!state.drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    currentStroke.points.push(pos);
    redrawAnnotations();
    // Draw current stroke too
    drawStroke(drawCtx, currentStroke);
  }

  function endDraw(e) {
    if (!state.drawing) return;
    state.drawing = false;
    if (currentStroke && currentStroke.points.length > 1) {
      getPagePaths().push(currentStroke);
    }
    currentStroke = null;
    redrawAnnotations();
  }

  drawCanvas.addEventListener('mousedown', startDraw);
  drawCanvas.addEventListener('mousemove', moveDraw);
  drawCanvas.addEventListener('mouseup', endDraw);
  drawCanvas.addEventListener('mouseleave', endDraw);
  drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
  drawCanvas.addEventListener('touchmove', moveDraw, { passive: false });
  drawCanvas.addEventListener('touchend', endDraw);

  function drawStroke(ctx, stroke) {
    if (stroke.points.length < 2) return;
    ctx.save();
    if (stroke.mode === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = stroke.color;
    }
    ctx.lineWidth = stroke.width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
    for (let i = 1; i < stroke.points.length; i++) {
      ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function redrawAnnotations() {
    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    const paths = getPagePaths();
    paths.forEach(stroke => drawStroke(drawCtx, stroke));
  }

  function getPagePaths() {
    const key = state.currentPage;
    if (!state.allPaths[key]) state.allPaths[key] = [];
    return state.allPaths[key];
  }

  // ── Undo / Clear ──
  document.getElementById('btnUndo').addEventListener('click', () => {
    const paths = getPagePaths();
    if (paths.length > 0) {
      paths.pop();
      redrawAnnotations();
    }
  });
  document.getElementById('btnClear').addEventListener('click', () => {
    if (confirm('このページの書き込みを全て消去しますか？')) {
      state.allPaths[state.currentPage] = [];
      redrawAnnotations();
    }
  });

  // ── Page nav ──
  document.getElementById('btnPrev').addEventListener('click', () => {
    if (state.currentPage > 1) {
      state.currentPage--;
      renderCurrentPage();
    }
  });
  document.getElementById('btnNext').addEventListener('click', () => {
    if (state.currentPage < state.totalPages) {
      state.currentPage++;
      renderCurrentPage();
    }
  });

  function updatePageInfo() {
    if (state.totalPages > 0) {
      pageInfo.textContent = `${state.currentPage} / ${state.totalPages}`;
    } else {
      pageInfo.textContent = '- / -';
    }
  }

  // ── PDF rendering ──
  async function loadPDF(data) {
    state.pdfDoc = await pdfjsLib.getDocument(data).promise;
    state.totalPages = state.pdfDoc.numPages;
    state.currentPage = 1;
    state.imageMode = false;
    state.allPaths = {};
    welcome.style.display = 'none';
    wrapper.style.display = 'block';
    renderCurrentPage();
  }

  async function renderCurrentPage() {
    if (state.imageMode) return;
    const page = await state.pdfDoc.getPage(state.currentPage);
    const viewport = page.getViewport({ scale: state.scale });
    bgCanvas.width = viewport.width;
    bgCanvas.height = viewport.height;
    drawCanvas.width = viewport.width;
    drawCanvas.height = viewport.height;
    await page.render({ canvasContext: bgCtx, viewport }).promise;
    redrawAnnotations();
    updatePageInfo();
  }

  // ── Image rendering ──
  function loadImage(img) {
    state.pdfDoc = null;
    state.imageMode = true;
    state.totalPages = 1;
    state.currentPage = 1;
    state.allPaths = {};

    const w = img.naturalWidth;
    const h = img.naturalHeight;
    bgCanvas.width = w;
    bgCanvas.height = h;
    drawCanvas.width = w;
    drawCanvas.height = h;
    bgCtx.drawImage(img, 0, 0);

    welcome.style.display = 'none';
    wrapper.style.display = 'block';
    redrawAnnotations();
    updatePageInfo();
  }

  // ── File input ──
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    handleFile(file);
  });

  function handleFile(file) {
    if (file.type === 'application/pdf') {
      const reader = new FileReader();
      reader.onload = (ev) => loadPDF({ data: new Uint8Array(ev.target.result) });
      reader.readAsArrayBuffer(file);
    } else if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => loadImage(img);
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    } else {
      showToast('対応していないファイル形式です');
    }
  }

  // ── Drag & Drop ──
  const dropOverlay = document.getElementById('dropOverlay');
  let dragCounter = 0;

  document.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragCounter++;
    dropOverlay.classList.add('show');
  });
  document.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) {
      dragCounter = 0;
      dropOverlay.classList.remove('show');
    }
  });
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove('show');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  // ── Google Drive URL ──
  const modalOverlay = document.getElementById('modalOverlay');
  const driveUrlInput = document.getElementById('driveUrlInput');

  document.getElementById('btnDriveUrl').addEventListener('click', () => {
    modalOverlay.classList.add('show');
    driveUrlInput.value = '';
    driveUrlInput.focus();
  });
  document.getElementById('btnModalCancel').addEventListener('click', () => {
    modalOverlay.classList.remove('show');
  });
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) modalOverlay.classList.remove('show');
  });
  driveUrlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btnModalLoad').click();
  });

  document.getElementById('btnModalLoad').addEventListener('click', () => {
    const url = driveUrlInput.value.trim();
    if (!url) return;

    const directUrl = convertDriveUrl(url);
    if (!directUrl) {
      showToast('Google Drive の共有URLを入力してください');
      return;
    }

    modalOverlay.classList.remove('show');
    showToast('画像を読み込み中...');

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      loadImage(img);
      showToast('読み込み完了');
    };
    img.onerror = () => {
      showToast('読み込みに失敗しました。共有設定を確認してください');
    };
    img.src = directUrl;
  });

  function convertDriveUrl(url) {
    // https://drive.google.com/file/d/FILE_ID/view?usp=sharing
    let match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (match) {
      return `https://drive.google.com/uc?export=view&id=${match[1]}`;
    }
    // https://drive.google.com/open?id=FILE_ID
    match = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (match) {
      return `https://drive.google.com/uc?export=view&id=${match[1]}`;
    }
    // Already a direct link or thumbnail link
    if (url.includes('drive.google.com/uc')) {
      return url;
    }
    // https://lh3.googleusercontent.com/ direct image
    if (url.includes('googleusercontent.com')) {
      return url;
    }
    return null;
  }

  // ── Save as image ──
  document.getElementById('btnSave').addEventListener('click', () => {
    if (state.totalPages === 0) return;

    const merged = document.createElement('canvas');
    merged.width = bgCanvas.width;
    merged.height = bgCanvas.height;
    const ctx = merged.getContext('2d');
    ctx.drawImage(bgCanvas, 0, 0);
    ctx.drawImage(drawCanvas, 0, 0);

    const link = document.createElement('a');
    link.download = `markup_page${state.currentPage}.png`;
    link.href = merged.toDataURL('image/png');
    link.click();
    showToast('画像を保存しました');
  });

  // ── Toast ──
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // ── Clipboard paste (Ctrl+V) ──
  document.addEventListener('paste', (e) => {
    const items = e.clipboardData?.items;
    if (!items) return;

    for (const item of items) {
      // Handle pasted image (screenshot, copied image from Drive, etc.)
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const blob = item.getAsFile();
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          loadImage(img);
          URL.revokeObjectURL(url);
          showToast('貼り付けた画像を読み込みました');
        };
        img.src = url;
        return;
      }
    }
  });

  // ── Keyboard shortcuts ──
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
      e.preventDefault();
      document.getElementById('btnUndo').click();
    }
    if (e.key === 'ArrowLeft') {
      document.getElementById('btnPrev').click();
    }
    if (e.key === 'ArrowRight') {
      document.getElementById('btnNext').click();
    }
  });
</script>
</body>
</html>
